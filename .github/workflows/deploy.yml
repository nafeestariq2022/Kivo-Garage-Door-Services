name: Deploy to SiteGround

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro Site
        run: npm run build

      - name: Deploy to SiteGround via Rsync
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.SITEGROUND_HOST }}
          REMOTE_USER: ${{ secrets.SITEGROUND_USER }}
          REMOTE_PORT: ${{ secrets.SITEGROUND_PORT }}
          TARGET: ${{ secrets.SITEGROUND_TARGET_DIR }}
