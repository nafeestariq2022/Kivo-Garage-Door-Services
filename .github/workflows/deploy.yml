name: Deploy to SiteGround

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro Site
        run: npm run build

      - name: Deploy to SiteGround via Rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SITEGROUND_SSH_PASSPHRASE }}
          REMOTE_HOST: ${{ secrets.SITEGROUND_HOST }}
          REMOTE_USER: ${{ secrets.SITEGROUND_USER }}
          REMOTE_PORT: ${{ secrets.SITEGROUND_PORT }}
          TARGET: ${{ secrets.SITEGROUND_TARGET_DIR }}
        run: |
          # Start SSH Agent
          eval $(ssh-agent -s)
          
          # Write private key to a temporary file
          echo "$SSH_PRIVATE_KEY" > deploy_key
          chmod 600 deploy_key
          
          # Use expect to pass the passphrase to ssh-add securely
          sudo apt-get update -y && sudo apt-get install -y expect
          expect -c '
            spawn ssh-add deploy_key
            expect "Enter passphrase"
            send "$env(SSH_PASSPHRASE)\r"
            expect eof
          '
          
          # Add remote host to known_hosts to prevent SSH prompt
          mkdir -p ~/.ssh
          ssh-keyscan -p "$REMOTE_PORT" "$REMOTE_HOST" >> ~/.ssh/known_hosts
          
          # Diagnostic: Check where we are and where the site is
          echo "=== DIAGNOSTICS ==="
          ssh -p $REMOTE_PORT "$REMOTE_USER@$REMOTE_HOST" '
            echo "Current Directory (PWD):"
            pwd
            echo "Directory contents:"
            ls -la
            echo "Checking www/ directory:"
            ls -la www/ || true
            echo "Checking www/matifs8.sg-host.com/ :"
            ls -la www/matifs8.sg-host.com/ || true
            echo "Finding the uploaded index.html:"
            find . -name "index.html" -maxdepth 4 || true
          '
          echo "==================="
          
          # Run Rsync to deploy
          rsync -rltgoDzvO --delete -e "ssh -p $REMOTE_PORT" dist/ "$REMOTE_USER@$REMOTE_HOST:$TARGET"
          
          # Clean up private key
          rm -f deploy_key
